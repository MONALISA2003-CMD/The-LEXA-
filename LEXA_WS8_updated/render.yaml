# Workstream 8 AI services. The existing API is adopted by name; it is not duplicated.
# Never place provider credentials in this file or in Git. The environment group
# is intentionally created empty: add provider values in Render after first sync.
# Render ignores sync:false entries inside environment-variable groups.
envVarGroups:
  - name: lexa-ai-provider-keys
    envVars: []

services:
  - type: pserv
    name: lexa-litellm
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: services/intelligence/litellm/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: lexa-ai-provider-keys
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: LEXA_AI_HF_ENABLED
        value: "false"

  - type: pserv
    name: lexa-intelligence
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: services/intelligence/Dockerfile
    dockerContext: .
    envVars:
      - key: LEXA_INTELLIGENCE_INTERNAL_TOKEN
        generateValue: true
      - key: LITELLM_BASE_URL
        fromService:
          type: pserv
          name: lexa-litellm
          property: hostport
      - key: LITELLM_API_KEY
        fromService:
          type: pserv
          name: lexa-litellm
          envVarKey: LITELLM_MASTER_KEY
      - key: LITELLM_PUBLIC_HELP_API_KEY
        fromService:
          type: pserv
          name: lexa-litellm
          envVarKey: LITELLM_MASTER_KEY
      # Keep both pools fail-closed until provider aliases and calls are tested.
      - key: LEXA_AI_BUSINESS_CONFIGURED
        value: "false"
      - key: LEXA_AI_PUBLIC_HELP_CONFIGURED
        value: "false"

  # Adopt the current Render web service by exact name and retain its existing
  # repo, branch, Frankfurt region, Free instance plan, Dockerfile and context.
  - type: web
    name: lexa-backend-api-live
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: LEXA_INTELLIGENCE_ENABLED
        value: "true"
      - key: LEXA_INTELLIGENCE_BASE_URL
        fromService:
          type: pserv
          name: lexa-intelligence
          property: hostport
      - key: LEXA_INTELLIGENCE_INTERNAL_TOKEN
        fromService:
          type: pserv
          name: lexa-intelligence
          envVarKey: LEXA_INTELLIGENCE_INTERNAL_TOKEN
      - key: LEXA_AI_BUSINESS_MODEL_ALIAS
        value: lexa-business-paid
