      responses:
        '201': { description: Ledger account created }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/branches/{branchId}/ledger/periods:
    parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/branchId' }]
    get:
      operationId: listAccountingPeriods
      responses:
        '200': { description: Accounting periods }
  /workspaces/{workspaceId}/branches/{branchId}/ledger/periods/{periodId}/close:
    parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/branchId' }, { in: path, name: periodId, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: closeAccountingPeriod
