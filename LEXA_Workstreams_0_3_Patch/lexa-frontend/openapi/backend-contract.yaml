      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [branchIds], properties: { branchIds: { type: array, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } } } } } } }
      responses:
        '200': { description: Branch grants replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workspaces/{workspaceId}/branches/{branchId}/ledger/accounts:
