    parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/branchId' }, { in: path, name: accountId, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getLedgerAccountActivity
      responses:
        '200': { description: Posted account activity }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lexa_session
      description: Secure, HttpOnly session cookie. Use SameSite=Lax for same-site deployments; when the frontend and API are cross-site, use SameSite=None; Secure. Avoid localStorage bearer tokens.
  parameters:
    workspaceId: { in: path, name: workspaceId, required: true, schema: { type: string, minLength: 1 } }
    branchId: { in: path, name: branchId, required: true, schema: { type: string, minLength: 1 } }
    productId: { in: path, name: productId, required: true, schema: { type: string, minLength: 1 } }
    saleId: { in: path, name: saleId, required: true, schema: { type: string, minLength: 1 } }
    moduleId: { in: path, name: moduleId, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' } }
    recordId: { in: path, name: recordId, required: true, schema: { type: string, minLength: 1 } }
    idempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 160 } }
    csrfToken: { in: header, name: X-CSRF-Token, required: true, schema: { type: string, minLength: 16 } }
  responses:
    Unauthorized: { description: Sign-in required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
    Forbidden: { description: The user lacks access to this workspace, branch, record or operation, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
    NotFound: { description: Resource not found within the authenticated principal's scope, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
    BadRequest: { description: Validation failure, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
    Conflict: { description: Business invariant or optimistic concurrency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ApiErrorEnvelope' } } } }
  schemas:
    GlobalSearchResult: { type: object, required: [id, type, label, href], properties: { id: { type: string }, type: { type: string }, label: { type: string }, description: { type: string }, href: { type: string }, reference: { type: string } } }
    AnalyticsBreakdown: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: number, minimum: 0 }, color: { type: string } } }
    ActivityEvent: { type: object, required: [id, kind, summary, occurredAt], properties: { id: { type: string }, kind: { type: string }, summary: { type: string }, actorName: { type: string }, occurredAt: { type: string, format: date-time }, href: { type: string } } }
    OverviewException: { type: object, required: [id, severity, title, detail], properties: { id: { type: string }, severity: { type: string, enum: [info, warning, critical] }, title: { type: string }, detail: { type: string }, href: { type: string } } }
    InboxThread: { type: object, required: [id, title, kind, unreadCount], properties: { id: { type: string }, title: { type: string }, kind: { type: string, enum: [direct, group, record] }, lastMessage: { type: string }, lastMessageAt: { type: string, format: date-time }, unreadCount: { type: integer, minimum: 0 }, participants: { type: array, items: { type: string } }, recordType: { type: string }, recordId: { type: string }, recordHref: { type: string } } }
    MessageReaction: { type: object, required: [emoji, count], properties: { emoji: { type: string }, count: { type: integer, minimum: 0 }, reactedByMe: { type: boolean } } }
    InboxMessage: { type: object, required: [id, threadId, body, senderId, senderName, sentAt], properties: { id: { type: string }, threadId: { type: string }, body: { type: string }, senderId: { type: string }, senderName: { type: string }, sentAt: { type: string, format: date-time }, editedAt: { type: string, format: date-time }, attachments: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, url: { type: string, format: uri }, mimeType: { type: string } } } }, reactions: { type: array, items: { $ref: '#/components/schemas/MessageReaction' } } } }
    InboxTask: { type: object, required: [id, title, status, priority], properties: { id: { type: string }, title: { type: string }, description: { type: string }, status: { type: string, enum: [open, in_progress, blocked, done, cancelled] }, priority: { type: string, enum: [low, normal, high, urgent] }, dueAt: { type: string, format: date-time }, assigneeName: { type: string }, href: { type: string } } }
    InboxApproval: { type: object, required: [id, title, requestedBy, requestedAt, status], properties: { id: { type: string }, title: { type: string }, description: { type: string }, requestedBy: { type: string }, requestedAt: { type: string, format: date-time }, status: { type: string, enum: [pending, approved, rejected] }, href: { type: string } } }
    InboxNotification: { type: object, required: [id, title, body, kind, createdAt], properties: { id: { type: string }, title: { type: string }, body: { type: string }, kind: { type: string }, createdAt: { type: string, format: date-time }, readAt: { type: string, format: date-time, nullable: true }, href: { type: string } } }
    BusinessToolsSnapshot: { type: object, required: [products, sales, returns, payments, movements], properties: { products: { type: array, items: { $ref: '#/components/schemas/Product' } }, sales: { type: array, items: { $ref: '#/components/schemas/Sale' } }, returns: { type: array, items: { type: object, additionalProperties: true } }, payments: { type: array, items: { type: object, additionalProperties: true } }, movements: { type: array, items: { $ref: '#/components/schemas/StockMovement' } } } }
    TaxProfile: { type: object, required: [tin, vatRegistered, sector, efrisOverride, vatThreshold, efrisTurnoverThreshold], properties: { tin: { type: string }, vatRegistered: { type: boolean }, sector: { type: string }, efrisOverride: { type: string, enum: [auto, yes, no] }, vatThreshold: { type: string, description: 'Optional user-verified value; do not prefill assumed legal thresholds' }, efrisTurnoverThreshold: { type: string, description: 'Optional user-verified value; do not prefill assumed legal thresholds' }, ruleSource: { type: string, description: 'Optional source/verification note; do not create one automatically' }, ruleEffectiveFrom: { type: string, description: 'Optional effective date for a user-verified policy; empty until verified' } } }
    CashUp: { type: object, required: [workspaceId, branchId, date, openingFloatMinor, otherCashInMinor, otherCashOutMinor, expectedCashMinor, countedCashMinor, varianceMinor, reason, savedAt], properties: { workspaceId: { type: string }, branchId: { type: string }, date: { type: string, format: date }, openingFloatMinor: { type: integer }, otherCashInMinor: { type: integer }, otherCashOutMinor: { type: integer }, expectedCashMinor: { type: integer }, countedCashMinor: { type: integer }, varianceMinor: { type: integer }, reason: { type: string }, savedAt: { type: string, format: date-time } } }
    ComplianceNote: { type: object, required: [id, date, documentType, internalReference, fdn, status, notes], properties: { id: { type: string }, date: { type: string, format: date }, documentType: { type: string }, internalReference: { type: string }, fdn: { type: string }, status: { type: string }, notes: { type: string } } }
    ComplianceNoteInput: { type: object, required: [date, documentType, internalReference, fdn, status, notes], properties: { date: { type: string, format: date }, documentType: { type: string }, internalReference: { type: string, minLength: 1, maxLength: 200 }, fdn: { type: string, maxLength: 200 }, status: { type: string }, notes: { type: string, maxLength: 2000 } } }
    AttachmentMetadata: { type: object, required: [id, workspaceId, branchId, reference, kind, name, mimeType, size, capturedAt], properties: { id: { type: string }, workspaceId: { type: string }, branchId: { type: string }, reference: { type: string }, kind: { type: string, enum: [product, receipt, other] }, name: { type: string }, mimeType: { type: string }, size: { type: integer }, capturedAt: { type: string, format: date-time } } }
    ApiErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
    Session: { type: object, required: [user, roles], properties: { user: { type: object, required: [id, email], properties: { id: { type: string }, email: { type: string, format: email }, displayName: { type: string } } }, roles: { type: array, items: { type: string } } } }
    Workspace:
      type: object
      required: [id, businessName, businessType, timezone, currency, createdAt]
      properties:
        id: { type: string }
        businessName: { type: string, minLength: 1, maxLength: 100 }
        businessType: { type: string }
        timezone: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
