        '201': { description: Posted balanced journal }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/branches/{branchId}/ledger/journals/{journalId}/reverse:
    parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/branchId' }, { in: path, name: journalId, required: true, schema: { type: string, format: uuid } }]
