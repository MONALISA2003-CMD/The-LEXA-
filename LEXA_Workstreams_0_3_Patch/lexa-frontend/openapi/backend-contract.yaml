      responses:
        '201': { description: Accounting period closed }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/branches/{branchId}/ledger/journals:
    parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/branchId' }]
    get:
      operationId: listLedgerJournals
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Ledger journal register }
    post:
      operationId: createLedgerJournal
      parameters: [{ $ref: '#/components/parameters/csrfToken' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [entryDate, memo, lines], properties: { entryDate: { type: string, format: date }, memo: { type: string, minLength: 1, maxLength: 500 }, lines: { type: array, minItems: 2, maxItems: 100, items: { type: object, required: [accountId], properties: { accountId: { type: string, format: uuid }, debitMinor: { type: integer, minimum: 0 }, creditMinor: { type: integer, minimum: 0 }, description: { type: string, maxLength: 300 } } } } } } } } }
