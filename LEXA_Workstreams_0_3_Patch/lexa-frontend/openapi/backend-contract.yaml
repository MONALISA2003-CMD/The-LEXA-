        '200': { description: Member branch grants, content: { application/json: { schema: { type: object, required: [userId, role, status, branchIds, allBranches], properties: { userId: { type: string }, role: { type: string }, status: { type: string }, branchIds: { type: array, items: { type: string, format: uuid } }, allBranches: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replaceMemberBranchScope
