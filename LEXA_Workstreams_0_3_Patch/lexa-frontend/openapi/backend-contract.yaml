      responses: { '204': { description: All visible notifications marked read }, '403': { $ref: '#/components/responses/Forbidden' } }
  /workspaces/{workspaceId}/activity:
    parameters: [{ $ref: '#/components/parameters/workspaceId' }]
    get:
      operationId: listActivity
      parameters: [{ in: query, name: branchId, required: true, schema: { type: string } }, { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }]
      responses: { '200': { description: Permission-filtered activity and audit events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActivityEvent' } } } } } }
  /workspaces/{workspaceId}/memberships/{userId}/branches:
