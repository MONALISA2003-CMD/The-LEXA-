name: LEXA Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "lexa-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "lexa-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lexa-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
