name: LEXA ZIP Extractor

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - "**/*.zip"
      - "*.ziP"
      - "**/*.ziP"
      - "*.zIp"
      - "**/*.zIp"
      - "*.zIP"
      - "**/*.zIP"
      - "*.Zip"
      - "**/*.Zip"
      - "*.ZiP"
      - "**/*.ZiP"
      - "*.ZIp"
      - "**/*.ZIp"
      - "*.ZIP"
      - "**/*.ZIP"
  workflow_dispatch:

# Uses only GitHub's built-in token. No GitHub App credentials or secrets needed.
permissions:
  contents: write

concurrency:
  group: lexa-zip-extractor-main
  cancel-in-progress: false

jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          persist-credentials: true

      - name: Validate, extract and remove ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          import stat
          import zipfile
          from pathlib import Path

          root = Path.cwd().resolve()
          git_dir = root / ".git"
          archives = sorted(
              p for p in root.rglob("*")
              if p.is_file() and not p.is_symlink()
              and p.suffix.lower() == ".zip" and git_dir not in p.parents
          )

          if not archives:
              print("No ZIP archives found. Nothing to do.")
              raise SystemExit(0)

          archive_paths = {p.resolve() for p in archives}
          validated = []
          extractable_count = 0

          def safe_parts(entry):
              name = entry.filename
              mode = entry.external_attr >> 16
              if not name or name.startswith("/") or "\\" in name:
                  raise SystemExit(f"Unsafe archive path: {name!r}")
              if stat.S_ISLNK(mode):
                  raise SystemExit(f"Symlinks are not accepted: {name!r}")
              while name.startswith("./"):
                  name = name[2:]
              is_dir = entry.is_dir() or stat.S_ISDIR(mode)
              if name in ("", "."):
                  if is_dir:
                      return None, True
                  raise SystemExit(f"Unsafe archive path: {entry.filename!r}")
              parts = name.rstrip("/").split("/")
              if not parts or any(p in ("", ".", "..") for p in parts):
                  raise SystemExit(f"Unsafe archive path: {entry.filename!r}")
              if ":" in parts[0] or ".git" in parts:
                  raise SystemExit(f"Unsafe archive path: {entry.filename!r}")
              return parts, is_dir

          # Validate every ZIP before writing any extracted files.
          for archive in archives:
              planned = []
              seen = set()
              with zipfile.ZipFile(archive) as zf:
                  entries = zf.infolist()
                  if not entries:
                      raise SystemExit(f"Refusing empty ZIP: {archive.name}")
                  bad_entry = zf.testzip()
                  if bad_entry is not None:
                      raise SystemExit(f"Corrupt ZIP entry: {bad_entry!r}")
                  for entry in entries:
                      parts, is_dir = safe_parts(entry)
                      if parts is None:
                          continue
                      # GITHUB_TOKEN cannot push workflow-file changes.
                      # Install workflow YAML separately using the GitHub web editor.
                      if len(parts) >= 2 and parts[0] == ".github" and parts[1] == "workflows":
                          print(f"Skipping restricted workflow file: {entry.filename}")
                          continue
                      destination = (root / Path(*parts)).resolve()
                      if destination == root or root not in destination.parents:
                          raise SystemExit(f"Archive path escapes repository: {entry.filename!r}")
                      if destination in archive_paths:
                          raise SystemExit(f"Archive would overwrite input ZIP: {entry.filename!r}")
                      if destination in seen:
                          raise SystemExit(f"Duplicate archive destination: {entry.filename!r}")
                      seen.add(destination)
                      planned.append((entry, parts, is_dir))
                      if not is_dir:
                          extractable_count += 1
              validated.append((archive, planned))

          if extractable_count == 0:
              raise SystemExit(
                  "No regular files to extract (workflow files are excluded). "
                  "ZIP archives were left untouched."
              )

          for archive, planned in validated:
              print(f"Extracting {archive.relative_to(root)}")
              with zipfile.ZipFile(archive) as zf:
                  for entry, parts, is_dir in planned:
                      destination = root / Path(*parts)
                      if is_dir:
                          destination.mkdir(parents=True, exist_ok=True)
                          continue
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(entry, "r") as source, destination.open("wb") as target:
                          shutil.copyfileobj(source, target)
              archive.unlink()
              print(f"Extracted and deleted {archive.name}")

          print(f"Successfully extracted and removed {len(validated)} ZIP archive(s).")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract repository ZIP archives"
          git push origin HEAD:main
          
