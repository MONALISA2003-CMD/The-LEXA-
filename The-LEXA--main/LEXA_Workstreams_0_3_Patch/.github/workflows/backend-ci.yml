name: LEXA Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "lexa-frontend/openapi/backend-contract.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "lexa-frontend/openapi/backend-contract.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/lexa?schema=public
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply all migrations to an empty PostgreSQL database
        run: npx prisma migrate deploy

      - name: Build backend
        run: npm run build

      - name: Run authorization policy tests
        run: npm test
