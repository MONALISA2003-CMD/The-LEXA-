openapi: 3.1.0
info:
  title: LEXA Frontend Backend Contract
  version: 1.0.0
  description: >-
    Proposed versioned API contract expected by the LEXA frontend. This is a contract
    for backend implementation, not evidence
    that a backend is deployed. All workspace and branch operations must verify the
    authenticated principal's permissions
    server-side. Mutating business operations must be transactional and auditable.


    The route inventory below is synchronized against the current NestJS controllers;
    CI checks controller path/method coverage.
    Paths are relative to the `/api/v1` base path.
servers:
- url: https://api.example.com/api/v1
  description: Replace with the real backend origin; never use client-side 
    secrets.
security:
- sessionCookie: []
paths:
  /health:
    get:
      operationId: getApiHealth
      security: []
      responses:
        '200': {description: Service availability only; does not confirm 
            database readiness or authenticated business access, content: {
              application/json: {schema: {type: object, required: [status], 
                  properties: {status: {type: string, enum: [ok, healthy]}, 
                    version: {type: string}}}}}}
  /auth/csrf:
    get:
      operationId: getCsrfToken
      security: []
      description: Return a short-lived CSRF token bound to the current 
        browser/session context; do not cache it in persistent browser storage.
      responses:
        '200': {description: CSRF token, content: {application/json: {schema: {
                  type: object, required: [token], properties: {token: {type: 
                      string, minLength: 16}}}}}}
  /auth/session:
    get:
      operationId: getAuthenticatedSession
      responses:
        '200': {description: Current session, content: {application/json: {
                schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/login:
    post:
      operationId: signIn
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [email, password], properties: {email: {type: 
                    string, format: email}, password: {type: string, minLength: 
                    1, maxLength: 1024}}}}}}
      responses:
        '200': {description: Session cookie issued, headers: {Set-Cookie: {
                schema: {type: string}, description: Secure HttpOnly SameSite 
                session cookie; never expose its value in JSON}}, content: {
              application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      operationId: signOut
      parameters: [$ref: '#/components/parameters/csrfToken']
      responses:
        '204': {description: Session invalidated and cookie expired}
  /auth/recovery/status:
    get:
      operationId: getPasswordRecoveryStatus
      security: []
      responses:
        '200': {description: Whether recovery email delivery is configured, content: {application/json: {schema: {type: object, required: [available], properties: {available: {type: boolean}}}}}}
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [email], properties: {email: {type: string, 
                    format: email}}}}}}
      responses:
        '202': {description: Generic accepted response that does not reveal 
            whether an account exists}
  /auth/password/reset:
    post:
      operationId: resetPassword
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [token, password], properties: {token: {type: 
                    string, minLength: 16}, password: {type: string, minLength: 
                    15, maxLength: 1024}}}}}}
      responses:
        '204': {description: Password reset token consumed and password changed}
        '400': {$ref: '#/components/responses/BadRequest'}
  /workspaces:
    get:
      operationId: listWorkspaces
      responses:
        '200': {description: Workspaces visible to the current user, content: {
              application/json: {schema: {$ref: '#/components/schemas/WorkspaceList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createWorkspace
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateWorkspace'}}}}
      responses:
        '201': {description: Workspace created, content: {application/json: {
                schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /workspaces/{workspaceId}:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: getWorkspace
      responses:
        '200': {description: Workspace, content: {application/json: {schema: {
                  $ref: '#/components/schemas/Workspace'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateWorkspace
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateWorkspace'}}}}
      responses:
        '200': {description: Updated workspace, content: {application/json: {
                schema: {$ref: '#/components/schemas/Workspace'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/branches:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listBranches
      responses:
        '200': {description: Branch list, content: {application/json: {schema: {
                  $ref: '#/components/schemas/BranchList'}}}}
    post:
      operationId: createBranch
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBranch'}}}}
      responses:
        '201': {description: Branch created, content: {application/json: {schema: {
                $ref: '#/components/schemas/Branch'}}}}
  /workspaces/{workspaceId}/products:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listProducts
      parameters:
      - {in: query, name: search, schema: {type: string}}
      - {in: query, name: activeOnly, schema: {type: boolean}}
      responses:
        '200': {description: Products, content: {application/json: {schema: {
                  $ref: '#/components/schemas/ProductList'}}}}
    post:
      operationId: createProduct
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProduct'}}}}
      responses:
        '201': {description: Product created, content: {application/json: {
                schema: {$ref: '#/components/schemas/Product'}}}}
  /workspaces/{workspaceId}/products/{productId}:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/productId']
    patch:
      operationId: updateProduct
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
      responses:
        '200': {description: Product updated, content: {application/json: {
                schema: {$ref: '#/components/schemas/Product'}}}}
  /workspaces/{workspaceId}/categories:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listCategories
      responses:
        '200': {description: Categories, content: {application/json: {schema: {
                  type: array, items: {$ref: '#/components/schemas/Category'}}}}}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/movements:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: listInventoryMovements
      parameters: [{in: query, name: limit, schema: {type: integer, minimum: 1, 
              maximum: 1000}}]
      responses:
        '200': {description: Movements, content: {application/json: {schema: {
                  type: array, items: {$ref: '#/components/schemas/StockMovement'}}}}}
    post:
      operationId: recordInventoryAdjustment
      parameters: [$ref: '#/components/parameters/idempotencyKey', $ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StockAdjustment'}}}}
      responses:
        '201': {description: Adjustment recorded, content: {application/json: {
                schema: {$ref: '#/components/schemas/StockMovement'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/balances:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getInventoryBalances
      responses:
        '200': {description: Product on-hand quantities, content: {
              application/json: {schema: {type: object, additionalProperties: {
                    type: number}}}}}
  /workspaces/{workspaceId}/sales:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listSales
      parameters: [{in: query, name: limit, schema: {type: integer, minimum: 1, 
              maximum: 1000}}]
      responses:
        '200': {description: Sales, content: {application/json: {schema: {type: 
                  array, items: {$ref: '#/components/schemas/Sale'}}}}}
  /workspaces/{workspaceId}/sales/{saleId}:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/saleId']
    get:
      operationId: getSale
      responses:
        '200': {description: Sale with lines, returns and payments: null, 
            content: {application/json: {schema: {$ref: '#/components/schemas/SaleDetail'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/sales/complete:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/idempotencyKey']
    post:
      operationId: completeSale
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: >-
        In one database transaction validate permissions, product availability, prices
        and totals; write sale,
        sale lines, payment records and stock effects; return the canonical sale.
        Never trust client-calculated totals.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteSale'}}}}
      responses:
        '201': {description: Sale completed, content: {application/json: {schema: {
                type: object, required: [sale], properties: {sale: {$ref: '#/components/schemas/Sale'}}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/sales/{saleId}/payments:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/saleId', $ref: '#/components/parameters/idempotencyKey']
    post:
      operationId: receiveSalePayment
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReceivePayment'}}}}
      responses:
        '201': {description: Payment record and outstanding balance}
  /workspaces/{workspaceId}/branches/{branchId}/sales/{saleId}/returns:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/saleId', $ref: '#/components/parameters/idempotencyKey']
    post:
      operationId: recordSaleReturn
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordReturn'}}}}
      responses:
        '201': {description: Return and refund record}
  /workspaces/{workspaceId}/branches/{branchId}/dashboard:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getDashboard
      responses:
        '200': {description: Server-derived dashboard, content: {
              application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/modules/{moduleId}/records:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/moduleId']
    get:
      operationId: listModuleRecords
      responses:
        '200': {description: Canonical records, content: {application/json: {
                schema: {$ref: '#/components/schemas/RecordList'}}}}
    put:
      operationId: replaceModuleRecords
      deprecated: true
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Deprecated and blocked by the API guard. Use individual versioned record writes; bulk replacement has no collection-level ETag.
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [records], properties: {records: {type: array, 
                    items: {$ref: '#/components/schemas/ModuleRecord'}}}}}}}
      responses:
        '200': {description: Replaced records, content: {application/json: {
                schema: {$ref: '#/components/schemas/RecordList'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteModuleRecords
      deprecated: true
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Deprecated and blocked by the API guard until an explicit collection ETag/confirmation contract exists.
      responses:
        '204': {description: Records deleted}
  /workspaces/{workspaceId}/branches/{branchId}/modules/{moduleId}/records/{recordId}:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/moduleId', $ref: '#/components/parameters/recordId']
    put:
      operationId: upsertModuleRecord
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/ifMatch']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModuleRecord'}}}}
      responses:
        '200': {description: Saved canonical record, content: {application/json: {
              schema: {$ref: '#/components/schemas/ModuleRecord'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/modules/{moduleId}/records/{recordId}/status:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/moduleId', $ref: '#/components/parameters/recordId']
    patch:
      operationId: changeModuleRecordStatus
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/ifMatchRequired']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [status], properties: {status: {type: string, 
                    minLength: 1, maxLength: 80}}}}}}
      responses:
        '200': {description: Updated record list, content: {application/json: {
                schema: {$ref: '#/components/schemas/RecordList'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/reports/modules:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getModuleReport
      parameters:
      - {in: query, name: report, required: true, schema: {type: string}}
      - {in: query, name: period, required: true, schema: {type: string}}
      - {in: query, name: currency, required: true, schema: {type: string, 
            pattern: '^[A-Z]{3}$'}}
      responses:
        '200': {description: Server-calculated report snapshot; not a substitute
            for statutory/accounting certification, content: {application/json: {
              schema: {$ref: '#/components/schemas/ModuleReport'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/business-tools/snapshot:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getBusinessToolsSnapshot
      description: Return workspace-scoped products, sales, returns, payments 
        and stock movements from authoritative backend records.
      responses:
        '200': {description: Business tools source snapshot, content: {
              application/json: {schema: {$ref: '#/components/schemas/BusinessToolsSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/business-tools/tax-profile:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: getBusinessTaxProfile
      responses:
        '200': {description: Server-maintained tax profile; thresholds are 
            user-supplied, not inferred legal advice: null, content: {
              application/json: {schema: {$ref: '#/components/schemas/TaxProfile'}}}}
    put:
      operationId: upsertBusinessTaxProfile
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaxProfile'}}}}
      responses:
        '200': {description: Saved profile, content: {application/json: {schema: {
                $ref: '#/components/schemas/TaxProfile'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/cash-ups:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: listCashUps
      responses:
        '200': {description: Cash-up records, content: {application/json: {
                schema: {type: array, items: {$ref: '#/components/schemas/CashUp'}}}}}
  /workspaces/{workspaceId}/branches/{branchId}/cash-ups/{cashUpDate}:
    parameters:
    - {$ref: '#/components/parameters/workspaceId'}
    - {$ref: '#/components/parameters/branchId'}
    - {in: path, name: cashUpDate, required: true, schema: {type: string, format: 
          date}}
    put:
      operationId: upsertCashUp
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CashUp'}}}}
      responses:
        '200': {description: Saved cash-up, content: {application/json: {schema: {
                $ref: '#/components/schemas/CashUp'}}}}
  /workspaces/{workspaceId}/compliance-notes:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listComplianceNotes
      responses:
        '200': {description: Internal document references, content: {
              application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ComplianceNote'}}}}}
    post:
      operationId: createComplianceNote
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceNoteInput'}}}}
      responses:
        '201': {description: Reference created, content: {application/json: {
                schema: {$ref: '#/components/schemas/ComplianceNote'}}}}
  /workspaces/{workspaceId}/imports/products-csv:
    parameters: [$ref: '#/components/parameters/workspaceId']
    post:
      operationId: importProductsCsv
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [currency, csv], properties: {currency: {type: 
                    string, pattern: '^[A-Z]{3}$'}, csv: {type: string, 
                    minLength: 1}}}}}}
      responses:
        '200': {description: Import summary, content: {application/json: {schema: {
                type: object, required: [importedCount], properties: {
                    importedCount: {type: integer, minimum: 0}}}}}}
  /workspaces/{workspaceId}/branches/{branchId}/imports/opening-stock-csv:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    post:
      operationId: importOpeningStockCsv
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [csv], properties: {csv: {type: string, 
                    minLength: 1}}}}}}
      responses:
        '200': {description: Import summary, content: {application/json: {schema: {
                type: object, required: [importedCount], properties: {
                    importedCount: {type: integer, minimum: 0}}}}}}
  /workspaces/{workspaceId}/backup:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: exportWorkspaceBackup
      responses:
        '200': {description: Authorized versioned workspace backup, content: {
              application/json: {schema: {type: object, required: [format, 
                    version, createdAt, workspaceId, data], properties: {format: {
                    type: string, const: lexa-workspace-backup}, version: {type: 
                      integer}, createdAt: {type: string, format: date-time}, 
                    workspaceId: {type: string}, data: {type: object, 
                      additionalProperties: true}}}}}}
  /workspaces/{workspaceId}/backup/restore:
    parameters: [$ref: '#/components/parameters/workspaceId']
    post:
      operationId: restoreWorkspaceBackup
      description: Require workspace-owner/admin permission, validate the 
        complete backup, restore transactionally, and create an immutable audit 
        entry before acknowledging completion.
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [backup], properties: {backup: {type: object, 
                    additionalProperties: true}}}}}}
      responses:
        '200': {description: Restore result, content: {application/json: {schema: {
                type: object, properties: {tablesRestored: {type: integer}, 
                    recordsRestored: {type: integer}, accepted: {type: boolean}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/search:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: searchWorkspaceRecords
      description: Search authorized workspace records across supported modules.
        Search by product name, SKU, barcode, receipt, customer, supplier, 
        order/invoice reference and record title. Enforce workspace/branch and 
        row-level permissions server-side.
      parameters:
      - {in: query, name: branchId, required: true, schema: {type: string}}
      - {in: query, name: q, required: true, schema: {type: string, minLength: 2,
          maxLength: 160}}
      - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50,
          default: 20}}
      responses:
        '200': {description: Search results, content: {application/json: {schema: {
                type: array, items: {$ref: '#/components/schemas/GlobalSearchResult'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/branches/{branchId}/analytics/overview:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getOverviewAnalytics
      description: Return verified, server-calculated overview KPIs and 
        analytics. Omit unavailable metrics or mark sourceCoverage false; never 
        fabricate chart values. Currency metrics use major currency units; core 
        ledgers remain in minor units.
      parameters:
      - {in: query, name: period, required: true, schema: {type: string, enum: [
              today, 7d, 30d, 90d, 12m]}}
      - {in: query, name: compare, schema: {type: boolean, default: true}}
      responses:
        '200': {description: Dashboard metrics, trends: null, breakdowns: null, 
            activity and exceptions: null, content: {application/json: {schema: {
                type: object, required: [generatedAt, period, kpis, salesTrend, 
                    salesByChannel, stockHealth, recentActivity, exceptions], 
                  properties: {generatedAt: {type: string, format: date-time}, 
                    period: {type: string}, comparisonPeriod: {type: string}, 
                    kpis: {type: array, items: {type: object, required: [key, 
                          label, value, unit], properties: {key: {type: string}, 
                          label: {type: string}, value: {type: number}, unit: {
                            type: string, enum: [currency, number, percent, 
                              duration]}, changePercent: {type: number, nullable: 
                            true}, previousValue: {type: number, nullable: true},
                        trend: {type: string, enum: [up, down, flat]}, 
                          description: {type: string}, href: {type: string}}}}, 
                    salesTrend: {type: array, items: {type: object, required: [
                          label, value], properties: {label: {type: string}, 
                          value: {type: number}, comparisonValue: {type: number, 
                            nullable: true}}}}, salesByChannel: {type: array, 
                      items: {$ref: '#/components/schemas/AnalyticsBreakdown'}}, 
                    stockHealth: {type: array, items: {$ref: '#/components/schemas/AnalyticsBreakdown'}},
                  recentActivity: {type: array, items: {$ref: '#/components/schemas/ActivityEvent'}},
                  exceptions: {type: array, items: {$ref: '#/components/schemas/OverviewException'}},
                  sourceCoverage: {type: object, additionalProperties: {type: 
                        boolean}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/inbox/threads:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listInboxThreads
      parameters: [{in: query, name: branchId, required: true, schema: {type: 
              string}}, {in: query, name: recordType, schema: {type: string}}, {
            in: query, name: recordId, schema: {type: string}}]
      responses:
        '200': {description: Authorized message threads, content: {
              application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InboxThread'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createInboxThread
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [branchId, title, kind, participantIds], 
                properties: {branchId: {type: string}, title: {type: string, 
                    minLength: 1, maxLength: 120}, kind: {type: string, enum: [
                      direct, group, record]}, participantIds: {type: array, 
                    minItems: 1, items: {type: string}}, recordType: {type: 
                    string}, recordId: {type: string}}}}}}
      responses:
