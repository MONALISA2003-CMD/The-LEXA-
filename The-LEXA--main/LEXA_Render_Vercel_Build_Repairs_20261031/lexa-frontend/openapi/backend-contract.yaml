        properties: {id: {type: string}, title: {type: string}, kind: {type: 
            string, enum: [direct, group, record]}, lastMessage: {type: string}, 
          lastMessageAt: {type: string, format: date-time}, unreadCount: {type: 
            integer, minimum: 0}, participants: {type: array, items: {type: 
              string}}, recordType: {type: string}, recordId: {type: string}, 
