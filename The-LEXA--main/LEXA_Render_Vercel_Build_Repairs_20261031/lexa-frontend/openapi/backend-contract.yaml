components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lexa_session
      description: Secure, HttpOnly session cookie. Use SameSite=Lax for 
        same-site deployments; when the frontend and API are cross-site, use 
        SameSite=None; Secure. Avoid localStorage bearer tokens.
  parameters:
    workspaceId: {in: path, name: workspaceId, required: true, schema: {type: 
          string, minLength: 1}}
    branchId: {in: path, name: branchId, required: true, schema: {type: string, 
          minLength: 1}}
    productId: {in: path, name: productId, required: true, schema: {type: string,
        minLength: 1}}
    saleId: {in: path, name: saleId, required: true, schema: {type: string, 
          minLength: 1}}
    moduleId: {in: path, name: moduleId, required: true, schema: {type: string, 
          pattern: '^[a-z0-9-]+$'}}
    recordId: {in: path, name: recordId, required: true, schema: {type: string, 
          minLength: 1}}
    ifMatch: {in: header, name: If-Match, required: false, description: Required when updating an existing record; use its current _version. Stale versions are rejected with 409., schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    ifMatchRequired: {in: header, name: If-Match, required: true, description: Current record _version. Stale versions are rejected with 409., schema: {type: string, pattern: '^[1-9][0-9]*$'}}
    idempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {
        type: string, minLength: 8, maxLength: 160}}
    csrfToken: {in: header, name: X-CSRF-Token, required: true, schema: {type: 
          string, minLength: 16}}
  responses:
    Unauthorized: {description: Sign-in required, content: {application/json: {
            schema: {$ref: '#/components/schemas/ApiErrorEnvelope'}}}}
    Forbidden: {description: The user lacks access to this workspace, branch: 
        null, record or operation: null, content: {application/json: {schema: {
              $ref: '#/components/schemas/ApiErrorEnvelope'}}}}
    NotFound: {description: Resource not found within the authenticated 
        principal's scope, content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorEnvelope'}}}}
    BadRequest: {description: Validation failure, content: {application/json: {
            schema: {$ref: '#/components/schemas/ApiErrorEnvelope'}}}}
    Conflict: {description: Business invariant or optimistic concurrency 
        conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorEnvelope'}}}}
  schemas:
    GlobalSearchResult: {type: object, required: [id, type, label, href], 
        properties: {id: {type: string}, type: {type: string}, label: {type: 
            string}, description: {type: string}, href: {type: string}, 
          reference: {type: string}}}
