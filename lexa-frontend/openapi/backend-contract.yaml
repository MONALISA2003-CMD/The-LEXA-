    post:
      operationId: markNotificationRead
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      responses: {'204': {description: Notification marked read}, '403': {$ref: '#/components/responses/Forbidden'}}
  /workspaces/{workspaceId}/notifications/read-all:
    parameters: [$ref: '#/components/parameters/workspaceId']
    post:
      operationId: markAllNotificationsRead
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      responses: {'204': {description: All visible notifications marked read}, '403': {
