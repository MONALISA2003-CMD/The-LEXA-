        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createInboxThread
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [branchId, title, kind, participantIds], 
                properties: {branchId: {type: string}, title: {type: string, 
                    minLength: 1, maxLength: 120}, kind: {type: string, enum: [
                      direct, group, record]}, participantIds: {type: array, 
                    minItems: 1, items: {type: string}}, recordType: {type: 
                    string}, recordId: {type: string}}}}}}
      responses:
        '201': {description: Created thread, content: {application/json: {schema: {
                $ref: '#/components/schemas/InboxThread'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/inbox/threads/{threadId}/messages:
    parameters: [$ref: '#/components/parameters/workspaceId', {in: path, name: 
          threadId, required: true, schema: {type: string}}]
    get:
      operationId: listThreadMessages
      responses:
        '200': {description: Messages in an authorized thread, content: {
              application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InboxMessage'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: sendThreadMessage
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [body], properties: {body: {type: string, 
                    minLength: 1, maxLength: 10000}}}}}}
      responses:
        '201': {description: Message accepted, content: {application/json: {
                schema: {$ref: '#/components/schemas/InboxMessage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/inbox/threads/{threadId}/messages/{messageId}/reactions:
    parameters: [$ref: '#/components/parameters/workspaceId', {in: path, name: 
          threadId, required: true, schema: {type: string}}, {in: path, name: 
