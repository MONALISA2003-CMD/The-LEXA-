        entry before acknowledging completion.
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [backup], properties: {backup: {type: object, 
                    additionalProperties: true}}}}}}
      responses:
        '200': {description: Restore result, content: {application/json: {schema: {
                type: object, properties: {tablesRestored: {type: integer}, 
                    recordsRestored: {type: integer}, accepted: {type: boolean}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/search:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: searchWorkspaceRecords
      description: Search authorized workspace records across supported modules.
        Search by product name, SKU, barcode, receipt, customer, supplier, 
        order/invoice reference and record title. Enforce workspace/branch and 
        row-level permissions server-side.
      parameters:
      - {in: query, name: branchId, required: true, schema: {type: string}}
      - {in: query, name: q, required: true, schema: {type: string, minLength: 2,
          maxLength: 160}}
      - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50,
          default: 20}}
      responses:
        '200': {description: Search results, content: {application/json: {schema: {
                type: array, items: {$ref: '#/components/schemas/GlobalSearchResult'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/branches/{branchId}/analytics/overview:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getOverviewAnalytics
      description: Return verified, server-calculated overview KPIs and 
        analytics. Omit unavailable metrics or mark sourceCoverage false; never 
        fabricate chart values. Currency metrics use major currency units; core 
        ledgers remain in minor units.
      parameters:
      - {in: query, name: period, required: true, schema: {type: string, enum: [
              today, 7d, 30d, 90d, 12m]}}
      - {in: query, name: compare, schema: {type: boolean, default: true}}
      responses:
        '200': {description: Dashboard metrics, trends: null, breakdowns: null, 
            activity and exceptions: null, content: {application/json: {schema: {
                type: object, required: [generatedAt, period, kpis, salesTrend, 
                    salesByChannel, stockHealth, recentActivity, exceptions], 
                  properties: {generatedAt: {type: string, format: date-time}, 
                    period: {type: string}, comparisonPeriod: {type: string}, 
                    kpis: {type: array, items: {type: object, required: [key, 
                          label, value, unit], properties: {key: {type: string}, 
                          label: {type: string}, value: {type: number}, unit: {
                            type: string, enum: [currency, number, percent, 
                              duration]}, changePercent: {type: number, nullable: 
                            true}, previousValue: {type: number, nullable: true},
                        trend: {type: string, enum: [up, down, flat]}, 
                          description: {type: string}, href: {type: string}}}}, 
                    salesTrend: {type: array, items: {type: object, required: [
                          label, value], properties: {label: {type: string}, 
                          value: {type: number}, comparisonValue: {type: number, 
                            nullable: true}}}}, salesByChannel: {type: array, 
                      items: {$ref: '#/components/schemas/AnalyticsBreakdown'}}, 
                    stockHealth: {type: array, items: {$ref: '#/components/schemas/AnalyticsBreakdown'}},
                  recentActivity: {type: array, items: {$ref: '#/components/schemas/ActivityEvent'}},
                  exceptions: {type: array, items: {$ref: '#/components/schemas/OverviewException'}},
                  sourceCoverage: {type: object, additionalProperties: {type: 
                        boolean}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/inbox/threads:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listInboxThreads
      parameters: [{in: query, name: branchId, required: true, schema: {type: 
