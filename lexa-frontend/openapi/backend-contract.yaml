      responses: {'200': {description: Notifications visible to the current user,
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/InboxNotification'}}}}}}
  /workspaces/{workspaceId}/notifications/{notificationId}/read:
    parameters: [$ref: '#/components/parameters/workspaceId', {in: path, name: 
