openapi: 3.1.0
info:
  title: LEXA Frontend Backend Contract
  version: 1.0.0
  description: >-
    Proposed versioned API contract expected by the LEXA frontend. This is a contract
    for backend implementation, not evidence
    that a backend is deployed. All workspace and branch operations must verify the
    authenticated principal's permissions
    server-side. Mutating business operations must be transactional and auditable.


    The route inventory below is synchronized against the current NestJS controllers;
    CI checks controller path/method coverage.
    Paths are relative to the `/api/v1` base path.
servers:
- url: https://api.example.com/api/v1
  description: Replace with the real backend origin; never use client-side 
    secrets.
security:
- sessionCookie: []
paths:
  /workspaces/{workspaceId}/branches/{branchId}/inventory/intelligence:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: inventoryBusinessIntelligence
      description: Real stock movements, product costs, reservations, available quantities, sales demand and expiry risk for the verified business.
      responses:
        '200': {description: Current inventory intelligence and cost-based estimates}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/lots/{lotId}/history:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: lotId, in: path, required: true, schema: {type: string}}
    get:
      operationId: inventoryLotTraceHistory
      description: Trace recorded batch movements and the completed sales containing the selected batch.
      responses:
        '200': {description: Auditable lot movement and sale history}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/lots/{lotId}/quarantine:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: lotId, in: path, required: true, schema: {type: string}}
    post:
      operationId: restrictInventoryLot
      description: Inventory-authorised restriction of a lot with reason and reservation checks.
      responses:
        '201': {description: Lot restricted from normal sale}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/lots/{lotId}/release:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: lotId, in: path, required: true, schema: {type: string}}
    post:
      operationId: releaseInspectedInventoryLot
      description: Release of inspected, non-expired stock by an authorised employee.
      responses:
        '201': {description: Available lot after verified release}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/replenishment/policies:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: readInventoryReorderPolicies
      description: Effective reorder thresholds, safety stock and supplier lead times.
      responses:
        '200': {description: Actual reorder plans}
  /workspaces/{workspaceId}/branches/{branchId}/logistics/packages:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: listPackedCustomerOrders
      description: Tenant-scoped packing register linked to sales orders and deliveries.
      responses:
        '200': {description: Parcel list with item details}
    post:
      operationId: packCustomerOrderItems
      description: Validate unfulfilled quantities and record a package without selling or deducting stock.
      responses:
        '201': {description: Parcel created}
  /workspaces/{workspaceId}/branches/{branchId}/logistics/packages/summary:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: packageStatusSummary
      description: Real package counts by verified status.
      responses:
        '200': {description: Package status totals}
  /workspaces/{workspaceId}/branches/{branchId}/logistics/packages/{packageId}/seal:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: packageId, in: path, required: true, schema: {type: string}}
    post:
      operationId: verifyAndSealPackage
      description: Require a packed order before sealing a package for dispatch.
      responses:
        '201': {description: Sealed parcel}
  /workspaces/{workspaceId}/branches/{branchId}/logistics/packages/{packageId}/cancel:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: packageId, in: path, required: true, schema: {type: string}}
    post:
      operationId: cancelUnsentPackage
      description: Release an unsent parcel's quantities with an audit reason.
      responses:
        '201': {description: Cancelled package}
  /workspaces/{workspaceId}/branches/{branchId}/selling/insights:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: listVerifiedSellingInsights
      description: Real tenant-scoped sales, receipts, returns, product rankings and current customer balances.
      responses:
        '200': {description: Verified selling performance}
        '403': {description: Business role cannot access sales}
  /workspaces/{workspaceId}/branches/{branchId}/selling/lookup:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lookupOriginalSaleForReturn
      description: Find original receipts by number or customer for safe recorded returns.
      responses:
        '200': {description: Original sale matches}
  /workspaces/{workspaceId}/catalog/price-lists/active:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    get:
      operationId: listApprovedCheckoutPrices
      description: Currently effective owner-approved selling prices.
      responses:
        '200': {description: Approved price lists and linked product prices}
  /workspaces/{workspaceId}/catalog/price-lists/{priceListId}/activate:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - {name: priceListId, in: path, required: true, schema: {type: string}}
    post:
      operationId: approveSellingPriceList
      description: Owner-only approval after products are priced.
      responses:
        '201': {description: Approved prices available for future sales}
  /workspaces/{workspaceId}/catalog/price-lists/{priceListId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - {name: priceListId, in: path, required: true, schema: {type: string}}
    post:
      operationId: withdrawSellingPriceList
      description: Owner-only withdrawal, leaving historical receipts unchanged.
      responses:
        '201': {description: Price list withdrawn}
  /workspaces/{workspaceId}/branches/{branchId}/crm/summary:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: getCustomerGrowthSummary
      description: Role-filtered lead, deal, campaign, follow-up and linked-sales overview using actual tenant-owned records.
      responses:
        '200': {description: Customer and growth metrics}
        '403': {description: Customer information is restricted for this role}
  /workspaces/{workspaceId}/branches/{branchId}/crm/people:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: getAssignedSalesPeople
      description: Active sales-capable employees linked to the same business; no private payroll fields.
      responses:
        '200': {description: Sales-capable employees}
  /workspaces/{workspaceId}/branches/{branchId}/crm/choices:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: getCheckoutCustomerGrowthChoices
      description: Verified customers, won deals and active employees available for explicit checkout attribution.
      responses:
        '200': {description: Customer, opportunity and salesperson choices}
        '403': {description: Sales authorization required}
  /workspaces/{workspaceId}/branches/{branchId}/crm/activities/{moduleId}/{recordId}:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: moduleId, in: path, required: true, schema: {type: string}}
      - {name: recordId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getCustomerInteractions
      description: Read scoped customer conversations and follow-up notes for an existing CRM record.
      responses:
        '200': {description: Customer interactions}
    post:
      operationId: recordCustomerInteraction
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Record a call, WhatsApp conversation, meeting, note, email or follow-up; does not send messages.
      responses:
        '201': {description: Customer activity recorded}
        '403': {description: CRM write permission required}
  /workspaces/{workspaceId}/branches/{branchId}/crm/convert/{moduleId}/{recordId}:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: moduleId, in: path, required: true, schema: {type: string}}
      - {name: recordId, in: path, required: true, schema: {type: string}}
    post:
      operationId: convertQualifiedCustomerJourney
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Convert qualified leads to deals or won deals/contacts to customers without merging duplicates.
      responses:
        '201': {description: Created or returned an existing linked customer journey record}
        '409': {description: Duplicate record or invalid conversion stage}
  /workspaces/{workspaceId}/branches/{branchId}/saas/features/{featureKey}:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
      - {name: featureKey, in: path, required: true, schema: {type: string}}
    put:
      operationId: lexaSaasFeaturesFeaturekeyPut
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/saas/support-diagnostics:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaSaasSupportDiagnosticsGet
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/saas/entitlements:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaSaasEntitlementsGet
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/saas/usage:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaSaasUsageGet
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/saas/plans:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaSaasPlansGet
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/reports/authoritative:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaReportsAuthoritativeGet
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/intelligence/extract:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    post:
      operationId: lexaIntelligenceExtractPost
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/intelligence/help:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    post:
      operationId: lexaIntelligenceHelpPost
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/intelligence/explain:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    post:
      operationId: lexaIntelligenceExplainPost
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/intelligence/status:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaIntelligenceStatusGet
      description: Existing tenant-scoped LEXA operation
      responses:
        '200': {description: Completed}
  /workspaces/{workspaceId}/branches/{branchId}/reports/library:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaBusinessReportLibrary
      description: Twelve role-filtered LEXA business reporting families with real SQL sources, trend and comparison data
      responses:
        '200': {description: Business reports}
        '403': {description: Role or plan denies access}
  /workspaces/{workspaceId}/branches/{branchId}/intelligence/brief:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/branchId'
    get:
      operationId: lexaDeterministicIntelligenceSnapshot
      description: Non-AI business overview derived from authorized operational aggregates
      responses:
        '200': {description: Verified snapshot}
        '403': {description: Role or plan denies access}
  /auth/change-initial-password:
    post:
      operationId: changeEmployeeInitialPassword
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Authenticated employee changes their temporary password. Required before accessing workspace records.
      responses:
        '200': {description: Initial password changed successfully}
        '401': {description: Session or temporary password invalid}
  /workspaces/{workspaceId}/staff:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    get:
      operationId: listCeoEmployeeProfiles
      description: CEO-only listing of employment, contact and protected HR data scoped to one business.
      responses:
        '200': {description: CEO employee profiles}
        '403': {description: Owner authorization required}
    post:
      operationId: createCeoEmployeeAccount
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: CEO creates a staff identity, employment record and assigned role in the existing business; mandatory temporary password rotation.
      responses:
        '201': {description: Employee created in existing workspace}
        '403': {description: CEO authorization required}
        '409': {description: Employee identity conflicts with existing account}
  /workspaces/{workspaceId}/staff/{employeeId}:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - {name: employeeId, in: path, required: true, schema: {type: string}}
    put:
      operationId: updateCeoEmployeeProfile
      parameters: [$ref: '#/components/parameters/csrfToken']
      responses:
        '200': {description: Employee biodata and employment profile updated}
        '403': {description: CEO authorization required}
  /workspaces/{workspaceId}/staff/{employeeId}/reset-password:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - {name: employeeId, in: path, required: true, schema: {type: string}}
    post:
      operationId: resetCeoEmployeeTemporaryPassword
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: CEO resets one non-owner employee temporary password and invalidates sessions.
      responses:
        '201': {description: Employee password reset and sessions revoked}
        '403': {description: CEO authorization required}
  /workspaces/{workspaceId}/my-employment:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    get:
      operationId: getOwnEmployeeSummary
      description: Authenticated employee reads only their own non-sensitive employment details.
      responses:
        '200': {description: Own employment summary or null}
        '401': {description: Sign-in required}
  /health:
    get:
      operationId: getApiHealth
      security: []
      responses:
        '200': {description: Service availability only; does not confirm 
            database readiness or authenticated business access, content: {
              application/json: {schema: {type: object, required: [status], 
                  properties: {status: {type: string, enum: [ok, healthy]}, 
                    version: {type: string}}}}}}
  /auth/signup:
    post:
      operationId: requestPublicSignup
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Request a one-time verification email; no account or business is created yet.
      responses:
        '202': {description: Verification requested without revealing whether email is registered}
        '503': {description: Email delivery is not configured}
  /auth/signup/verify:
    post:
      operationId: verifyPublicSignup
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Consume a one-time email token; atomically create user, private business, owner membership and first branch.
      responses:
        '201': {description: Verified account created and session cookie issued}
        '400': {description: Verification link expired or invalid}
  /auth/invitations/preview:
    post:
      operationId: previewEmployeeInvitation
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Show a tenant-bound invitation when the caller possesses its private token.
      responses:
        '201': {description: Invitation details}
        '400': {description: Invitation invalid, expired or used}
  /auth/invitations/accept:
    post:
      operationId: acceptExistingEmployeeInvitation
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Validate a signed-in user and private invitation token; grant only the invited tenant and branch scope.
      responses:
        '201': {description: Existing user added to the invited workspace}
        '401': {description: Sign-in required}
        '403': {description: Session email does not match invitation email}
  /auth/invitations/join:
    post:
      operationId: joinEmployeeInvitation
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Create an employee identity and attach only its invited tenant and branch scope.
      responses:
        '201': {description: Employee created; session cookie issued}
        '409': {description: Existing account must sign in to accept}
  /auth/csrf:
    get:
      operationId: getCsrfToken
      security: []
      description: Return a short-lived CSRF token bound to the current 
        browser/session context; do not cache it in persistent browser storage.
      responses:
        '200': {description: CSRF token, content: {application/json: {schema: {
                  type: object, required: [token], properties: {token: {type: 
                      string, minLength: 16}}}}}}
  /auth/session:
    get:
      operationId: getAuthenticatedSession
      responses:
        '200': {description: Current session, content: {application/json: {
                schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/login:
    post:
      operationId: signIn
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [email, password], properties: {email: {type: 
                    string, format: email}, password: {type: string, minLength: 
                    1, maxLength: 1024}}}}}}
      responses:
        '200': {description: Session cookie issued, headers: {Set-Cookie: {
                schema: {type: string}, description: Secure HttpOnly SameSite 
                session cookie; never expose its value in JSON}}, content: {
              application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      operationId: signOut
      parameters: [$ref: '#/components/parameters/csrfToken']
      responses:
        '204': {description: Session invalidated and cookie expired}
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [email], properties: {email: {type: string, 
                    format: email}}}}}}
      responses:
        '202': {description: Generic accepted response that does not reveal 
            whether an account exists}
  /auth/password/reset:
    post:
      operationId: resetPassword
      security: []
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [token, password], properties: {token: {type: 
                    string, minLength: 16}, password: {type: string, minLength: 
                    12, maxLength: 1024}}}}}}
      responses:
        '204': {description: Password reset token consumed and password changed}
        '400': {$ref: '#/components/responses/BadRequest'}
  /workspaces:
    get:
      operationId: listWorkspaces
      responses:
        '200': {description: Workspaces visible to the current user, content: {
              application/json: {schema: {$ref: '#/components/schemas/WorkspaceList'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createWorkspace
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateWorkspace'}}}}
      responses:
        '201': {description: Workspace created, content: {application/json: {
                schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /workspaces/{workspaceId}:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: getWorkspace
      responses:
        '200': {description: Workspace, content: {application/json: {schema: {
                  $ref: '#/components/schemas/Workspace'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateWorkspace
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateWorkspace'}}}}
      responses:
        '200': {description: Updated workspace, content: {application/json: {
                schema: {$ref: '#/components/schemas/Workspace'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/business-setup:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    get:
      operationId: getBusinessSetup
      description: Tenant-scoped business identity, operations, and manual payment recording preferences. No gateways.
      responses:
        '200': {description: Business setup profile including payment method configuration}
    patch:
      operationId: saveBusinessSetupStep
      description: Owner-only, CSRF protected and audit logged. Save one setup step without creating a new tenant.
      parameters: [$ref: '#/components/parameters/csrfToken']
      responses:
        '200': {description: Saved setup step}
        '403': {description: Owner permission required}
  /workspaces/{workspaceId}/business-setup/complete:
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    post:
      operationId: completeBusinessSetup
      description: Owner-only confirmation that required profile and manual payment details are present.
      parameters: [$ref: '#/components/parameters/csrfToken']
      responses:
        '201': {description: Business setup completed}
        '400': {description: Required setup information missing}
  /workspaces/{workspaceId}/branches:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listBranches
      responses:
        '200': {description: Branch list, content: {application/json: {schema: {
                  $ref: '#/components/schemas/BranchList'}}}}
    post:
      operationId: createBranch
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBranch'}}}}
      responses:
        '201': {description: Branch created, content: {application/json: {schema: {
                $ref: '#/components/schemas/Branch'}}}}
  /workspaces/{workspaceId}/products:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listProducts
      parameters:
      - {in: query, name: search, schema: {type: string}}
      - {in: query, name: activeOnly, schema: {type: boolean}}
      responses:
        '200': {description: Products, content: {application/json: {schema: {
                  $ref: '#/components/schemas/ProductList'}}}}
    post:
      operationId: createProduct
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateProduct'}}}}
      responses:
        '201': {description: Product created, content: {application/json: {
                schema: {$ref: '#/components/schemas/Product'}}}}
  /workspaces/{workspaceId}/products/{productId}:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/productId']
    patch:
      operationId: updateProduct
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
      responses:
        '200': {description: Product updated, content: {application/json: {
                schema: {$ref: '#/components/schemas/Product'}}}}
  /workspaces/{workspaceId}/categories:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listCategories
      responses:
        '200': {description: Categories, content: {application/json: {schema: {
                  type: array, items: {$ref: '#/components/schemas/Category'}}}}}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/movements:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: listInventoryMovements
      parameters: [{in: query, name: limit, schema: {type: integer, minimum: 1, 
              maximum: 1000}}]
      responses:
        '200': {description: Movements, content: {application/json: {schema: {
                  type: array, items: {$ref: '#/components/schemas/StockMovement'}}}}}
    post:
      operationId: recordInventoryAdjustment
      parameters: [$ref: '#/components/parameters/idempotencyKey', $ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StockAdjustment'}}}}
      responses:
        '201': {description: Adjustment recorded, content: {application/json: {
                schema: {$ref: '#/components/schemas/StockMovement'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/inventory/balances:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getInventoryBalances
      responses:
        '200': {description: Product on-hand quantities, content: {
              application/json: {schema: {type: object, additionalProperties: {
                    type: number}}}}}
  /workspaces/{workspaceId}/sales:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listSales
      parameters: [{in: query, name: limit, schema: {type: integer, minimum: 1, 
              maximum: 1000}}]
      responses:
        '200': {description: Sales, content: {application/json: {schema: {type: 
                  array, items: {$ref: '#/components/schemas/Sale'}}}}}
  /workspaces/{workspaceId}/sales/{saleId}:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/saleId']
    get:
      operationId: getSale
      responses:
        '200': {description: Sale with lines, returns and payments: null, 
            content: {application/json: {schema: {$ref: '#/components/schemas/SaleDetail'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/sales/complete:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/idempotencyKey']
    post:
      operationId: completeSale
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: >-
        In one database transaction validate permissions, product availability, prices
        and totals; write sale,
        sale lines, payment records and stock effects; return the canonical sale.
        Never trust client-calculated totals.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompleteSale'}}}}
      responses:
        '201': {description: Sale completed, content: {application/json: {schema: {
                type: object, required: [sale], properties: {sale: {$ref: '#/components/schemas/Sale'}}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/sales/{saleId}/payments:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/saleId', $ref: '#/components/parameters/idempotencyKey']
    post:
      operationId: receiveSalePayment
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReceivePayment'}}}}
      responses:
        '201': {description: Payment record and outstanding balance}
  /workspaces/{workspaceId}/branches/{branchId}/sales/{saleId}/returns:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/saleId', $ref: '#/components/parameters/idempotencyKey']
    post:
      operationId: recordSaleReturn
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordReturn'}}}}
      responses:
        '201': {description: Return and refund record}
  /workspaces/{workspaceId}/branches/{branchId}/dashboard:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getDashboard
      responses:
        '200': {description: Server-derived dashboard, content: {
              application/json: {schema: {$ref: '#/components/schemas/Dashboard'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/modules/{moduleId}/records:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/moduleId']
    get:
      operationId: listModuleRecords
      responses:
        '200': {description: Canonical records, content: {application/json: {
                schema: {$ref: '#/components/schemas/RecordList'}}}}
    put:
      operationId: replaceModuleRecords
      deprecated: true
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Deprecated and blocked by the API guard. Use individual versioned record writes; bulk replacement has no collection-level ETag.
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [records], properties: {records: {type: array, 
                    items: {$ref: '#/components/schemas/ModuleRecord'}}}}}}}
      responses:
        '200': {description: Replaced records, content: {application/json: {
                schema: {$ref: '#/components/schemas/RecordList'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: deleteModuleRecords
      deprecated: true
      parameters: [$ref: '#/components/parameters/csrfToken']
      description: Deprecated and blocked by the API guard until an explicit collection ETag/confirmation contract exists.
      responses:
        '204': {description: Records deleted}
  /workspaces/{workspaceId}/branches/{branchId}/modules/{moduleId}/records/{recordId}:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/moduleId', $ref: '#/components/parameters/recordId']
    put:
      operationId: upsertModuleRecord
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/ifMatch']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModuleRecord'}}}}
      responses:
        '200': {description: Saved canonical record, content: {application/json: {
              schema: {$ref: '#/components/schemas/ModuleRecord'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/modules/{moduleId}/records/{recordId}/status:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId',
      $ref: '#/components/parameters/moduleId', $ref: '#/components/parameters/recordId']
    patch:
      operationId: changeModuleRecordStatus
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/ifMatchRequired']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [status], properties: {status: {type: string, 
                    minLength: 1, maxLength: 80}}}}}}
      responses:
        '200': {description: Updated record list, content: {application/json: {
                schema: {$ref: '#/components/schemas/RecordList'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}/branches/{branchId}/reports/modules:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getModuleReport
      parameters:
      - {in: query, name: report, required: true, schema: {type: string}}
      - {in: query, name: period, required: true, schema: {type: string}}
      - {in: query, name: currency, required: true, schema: {type: string, 
            pattern: '^[A-Z]{3}$'}}
      responses:
        '200': {description: Server-calculated report snapshot; not a substitute
            for statutory/accounting certification, content: {application/json: {
              schema: {$ref: '#/components/schemas/ModuleReport'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/business-tools/snapshot:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: getBusinessToolsSnapshot
      description: Return workspace-scoped products, sales, returns, payments 
        and stock movements from authoritative backend records.
      responses:
        '200': {description: Business tools source snapshot, content: {
              application/json: {schema: {$ref: '#/components/schemas/BusinessToolsSnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/business-tools/tax-profile:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: getBusinessTaxProfile
      responses:
        '200': {description: Server-maintained tax profile; thresholds are 
            user-supplied, not inferred legal advice: null, content: {
              application/json: {schema: {$ref: '#/components/schemas/TaxProfile'}}}}
    put:
      operationId: upsertBusinessTaxProfile
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TaxProfile'}}}}
      responses:
        '200': {description: Saved profile, content: {application/json: {schema: {
                $ref: '#/components/schemas/TaxProfile'}}}}
  /workspaces/{workspaceId}/branches/{branchId}/cash-ups:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    get:
      operationId: listCashUps
      responses:
        '200': {description: Cash-up records, content: {application/json: {
                schema: {type: array, items: {$ref: '#/components/schemas/CashUp'}}}}}
  /workspaces/{workspaceId}/branches/{branchId}/cash-ups/{cashUpDate}:
    parameters:
    - {$ref: '#/components/parameters/workspaceId'}
    - {$ref: '#/components/parameters/branchId'}
    - {in: path, name: cashUpDate, required: true, schema: {type: string, format: 
          date}}
    put:
      operationId: upsertCashUp
      parameters: [$ref: '#/components/parameters/csrfToken']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CashUp'}}}}
      responses:
        '200': {description: Saved cash-up, content: {application/json: {schema: {
                $ref: '#/components/schemas/CashUp'}}}}
  /workspaces/{workspaceId}/compliance-notes:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: listComplianceNotes
      responses:
        '200': {description: Internal document references, content: {
              application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ComplianceNote'}}}}}
    post:
      operationId: createComplianceNote
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ComplianceNoteInput'}}}}
      responses:
        '201': {description: Reference created, content: {application/json: {
                schema: {$ref: '#/components/schemas/ComplianceNote'}}}}
  /workspaces/{workspaceId}/imports/products-csv:
    parameters: [$ref: '#/components/parameters/workspaceId']
    post:
      operationId: importProductsCsv
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [currency, csv], properties: {currency: {type: 
                    string, pattern: '^[A-Z]{3}$'}, csv: {type: string, 
                    minLength: 1}}}}}}
      responses:
        '200': {description: Import summary, content: {application/json: {schema: {
                type: object, required: [importedCount], properties: {
                    importedCount: {type: integer, minimum: 0}}}}}}
  /workspaces/{workspaceId}/branches/{branchId}/imports/opening-stock-csv:
    parameters: [$ref: '#/components/parameters/workspaceId', $ref: '#/components/parameters/branchId']
    post:
      operationId: importOpeningStockCsv
      parameters: [$ref: '#/components/parameters/csrfToken', $ref: '#/components/parameters/idempotencyKey']
      requestBody: {required: true, content: {application/json: {schema: {type: 
                object, required: [csv], properties: {csv: {type: string, 
                    minLength: 1}}}}}}
      responses:
        '200': {description: Import summary, content: {application/json: {schema: {
                type: object, required: [importedCount], properties: {
                    importedCount: {type: integer, minimum: 0}}}}}}
  /workspaces/{workspaceId}/backup:
    parameters: [$ref: '#/components/parameters/workspaceId']
    get:
      operationId: exportWorkspaceBackup
      responses:
        '200': {description: Authorized versioned workspace backup, content: {
              application/json: {schema: {type: object, required: [format, 
                    version, createdAt, workspaceId, data], properties: {format: {
                    type: string, const: lexa-workspace-backup}, version: {type: 
                      integer}, createdAt: {type: string, format: date-time}, 
                    workspaceId: {type: string}, data: {type: object, 
                      additionalProperties: true}}}}}}
  /workspaces/{workspaceId}/backup/restore:
    parameters: [$ref: '#/components/parameters/workspaceId']
    post:
      operationId: restoreWorkspaceBackup
      description: Require workspace-owner/admin permission, validate the 
