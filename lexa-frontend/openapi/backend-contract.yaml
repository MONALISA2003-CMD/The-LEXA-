  /workspaces/{workspaceId}/memberships/{userId}/branches:
    parameters:
    - {$ref: '#/components/parameters/workspaceId'}
    - {in: path, name: userId, required: true, schema: {type: string, format: 
          uuid}}
    get:
      operationId: getMemberBranchScope
