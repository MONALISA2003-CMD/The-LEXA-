
name: LEXA isolated browser workflow tests

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh LEXA from a clean repository ZIP
    types: [completed]
  pull_request:
    paths:
      - 'lexa-frontend/**'
      - '.github/workflows/lexa-staging-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'lexa-frontend/**'
      - '.github/workflows/lexa-staging-e2e.yml'

permissions:
  contents: read

concurrency:
  group: lexa-browser-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Local-only Playwright module + core workflows
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: lexa-frontend

    env:
      CI: 'true'
      VITE_DATA_PROVIDER: local
      VITE_API_BASE_URL: ''

    steps:
      - name: Checkout current main source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated LEXA browser tests
        run: npm run test:e2e -- --reporter=line

      - name: Preserve failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lexa-playwright-evidence
          path: |
            lexa-frontend/test-results
            lexa-frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7
          
