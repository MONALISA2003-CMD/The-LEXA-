
name: LEXA ZIP Extractor

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - "**/*.zip"
      - "*.ziP"
      - "**/*.ziP"
      - "*.zIp"
      - "**/*.zIp"
      - "*.zIP"
      - "**/*.zIP"
      - "*.Zip"
      - "**/*.Zip"
      - "*.ZiP"
      - "**/*.ZiP"
      - "*.ZIp"
      - "**/*.ZIp"
      - "*.ZIP"
      - "**/*.ZIP"
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only.
# Publishing is done using the installation token below.
permissions:
  contents: read

concurrency:
  group: lexa-zip-extractor-main
  cancel-in-progress: false

jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LEXA_APP_CLIENT_ID }}
          private-key: ${{ secrets.LEXA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: The-LEXA-
          permission-contents: write
          permission-workflows: write

      - name: Check out repository using App token
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Find, validate, extract and remove ZIP archives
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import shutil
          import stat
          import zipfile
          from pathlib import Path

          root = Path.cwd().resolve()
          git_dir = root / ".git"

          archives = sorted(
              p for p in root.rglob("*")
              if p.is_file()
              and not p.is_symlink()
              and p.suffix.lower() == ".zip"
              and git_dir not in p.parents
          )

          if not archives:
              print("No ZIP archives found. Nothing to do.")
              raise SystemExit(0)

          archive_paths = {p.resolve() for p in archives}

          print("ZIP archives found:")
          for archive in archives:
              print(f" - {archive.relative_to(root)}")

          def safe_parts(entry):
              name = entry.filename
              mode = entry.external_attr >> 16

              if not name or name.startswith("/") or "\\" in name:
                  raise SystemExit(f"Unsafe archive path: {name!r}")

              if stat.S_ISLNK(mode):
                  raise SystemExit(
                      f"Symlinks are not accepted: {name!r}"
                  )

              while name.startswith("./"):
                  name = name[2:]

              is_dir = entry.is_dir() or stat.S_ISDIR(mode)

              if name in ("", "."):
                  if is_dir:
                      return None, True
                  raise SystemExit(
                      f"Unsafe archive path: {entry.filename!r}"
                  )

              parts = name.rstrip("/").split("/")

              if not parts or any(
                  part in ("", ".", "..") for part in parts
              ):
                  raise SystemExit(
                      f"Unsafe archive path: {entry.filename!r}"
                  )

              if ":" in parts[0] or ".git" in parts:
                  raise SystemExit(
                      f"Unsafe archive path: {entry.filename!r}"
                  )

              return parts, is_dir

          # Validate every archive before modifying repository files.
          validated = []

          for archive in archives:
              with zipfile.ZipFile(archive) as zf:
                  entries = zf.infolist()

                  if not entries:
                      raise SystemExit(
                          f"Refusing empty ZIP: {archive.name}"
                      )

                  bad_entry = zf.testzip()
                  if bad_entry is not None:
                      raise SystemExit(
                          f"Corrupt ZIP entry: {bad_entry!r}"
                      )

                  seen = set()
                  planned = []

                  for entry in entries:
                      parts, is_dir = safe_parts(entry)

                      if parts is None:
                          continue

                      destination = (
                          root / Path(*parts)
                      ).resolve()

                      if (
                          destination == root
                          or root not in destination.parents
                      ):
                          raise SystemExit(
                              f"Archive path escapes repository: "
                              f"{entry.filename!r}"
                          )

                      if destination in archive_paths:
                          raise SystemExit(
                              f"Archive would overwrite input ZIP: "
                              f"{entry.filename!r}"
                          )

                      if destination in seen:
                          raise SystemExit(
                              f"Duplicate archive destination: "
                              f"{entry.filename!r}"
                          )

                      seen.add(destination)
                      planned.append((entry, parts, is_dir))

                  validated.append((archive, planned))

          # Extract only after all archives have passed validation.
          for archive, planned in validated:
              print(f"Extracting {archive.relative_to(root)}")

              with zipfile.ZipFile(archive) as zf:
                  for entry, parts, is_dir in planned:
                      destination = root / Path(*parts)

                      if is_dir:
                          destination.mkdir(
                              parents=True,
                              exist_ok=True
                          )
                          continue

                      destination.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      with zf.open(entry, "r") as source:
                          with destination.open("wb") as target:
                              shutil.copyfileobj(source, target)

              archive.unlink()
              print(f"Extracted and deleted {archive.name}")

          print(
              f"Successfully extracted and removed "
              f"{len(validated)} ZIP archive(s)."
          )
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi

          git commit -m "Extract repository ZIP archives"

          # Checkout persisted the GitHub App token.
          git push origin HEAD:main
          
