name: Import clean LEXA source ZIP

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
  workflow_dispatch:
    inputs:
      archive_name:
        description: "Optional ZIP filename in the repository root. Leave blank when only one ZIP exists."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: lexa-clean-source-import
  cancel-in-progress: false

jobs:
  import:
    name: Validate, replace, test and commit clean source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate ZIP and prepare a clean source tree
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import json
          import os
          import shutil
          import stat
          import subprocess
          import tempfile
          import unicodedata
          import zipfile

          ROOT = Path.cwd().resolve()
          requested = os.environ.get("ARCHIVE_NAME", "").strip()
          event_name = os.environ.get("EVENT_NAME", "")

          # On ZIP-upload pushes, select the archive changed by this push.
          # Older failed ZIPs may remain at the repository root and will not
          # make a new upload ambiguous.
          if requested:
              candidate = PurePosixPath(requested)
              if candidate.name != requested or candidate.suffix.lower() != ".zip":
                  raise SystemExit("archive_name must be a root-level ZIP filename, not a path.")
              archives = [ROOT / requested]
          elif event_name == "push":
              before = os.environ.get("EVENT_BEFORE", "")
              head = os.environ.get("EVENT_SHA", "HEAD")
              if not before or set(before) == {"0"}:
                  changed_paths = subprocess.check_output(
                      ["git", "ls-tree", "-r", "--name-only", head], text=True
                  ).splitlines()
              else:
                  changed_paths = subprocess.check_output(
                      ["git", "diff", "--name-only", before, head, "--", "*.zip"],
                      text=True,
                  ).splitlines()
              changed_root_zips = sorted(
                  path for path in changed_paths
                  if PurePosixPath(path).parent == PurePosixPath(".")
                  and PurePosixPath(path).suffix.lower() == ".zip"
              )
              if len(changed_root_zips) != 1:
                  raise SystemExit(
                      "This push must add or update exactly one ZIP at the repository root; "
                      f"found: {changed_root_zips!r}."
                  )
              archives = [ROOT / changed_root_zips[0]]
          else:
              archives = sorted(
                  item for item in ROOT.iterdir()
                  if item.is_file() and not item.is_symlink() and item.suffix.lower() == ".zip"
              )

          if len(archives) != 1:
              if not archives:
                  raise SystemExit("No ZIP was found. Upload one .zip file to the repository root or provide archive_name.")
              raise SystemExit(
                  "More than one root-level ZIP was found: "
                  + ", ".join(item.name for item in archives)
                  + ". Specify archive_name in a manual run."
              )

          archive = archives[0]
          if not archive.is_file() or archive.is_symlink():
              raise SystemExit("The selected archive is not a regular file.")

          ALLOWED_ROOT_DIRS = {"backend", "lexa-frontend", "docs", "scripts", ".github"}
          ALLOWED_ROOT_FILES = {
              ".dockerignore", ".gitignore", ".nvmrc", "README.md",
              "REPOSITORY_LAYOUT_MANIFEST.json", "render.yaml",
              "LICENSE", "LICENSE.md", "NOTICE", "SECURITY.md", "CODEOWNERS",
              ".gitattributes", ".editorconfig", ".prettierrc", ".prettierignore",
          }
          REQUIRED_FILES = {
              "README.md",
              "render.yaml",
              "REPOSITORY_LAYOUT_MANIFEST.json",
              "backend/package.json",
              "backend/Dockerfile",
              "backend/prisma/schema.prisma",
              "lexa-frontend/package.json",
              "lexa-frontend/vercel.json",
              "scripts/clean_repository.py",
              "scripts/validate_repository.py",
              "docs/architecture/backend-architecture.md",
              "docs/deployment/deployment-guide.md",
              "docs/operations/runbooks/README.md",
          }
          EXPECTED_PACKAGE_FILES = {"backend/package.json", "lexa-frontend/package.json"}
          EXPECTED_LOCK_FILES = {"backend/package-lock.json", "lexa-frontend/package-lock.json"}
          FORBIDDEN_PARTS = {
              ".git", "node_modules", "dist", "coverage", ".vercel",
              "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", ".turbo",
          }
          LEGACY_COPY_NAMES = {
              "the-lexa", "the-lexa--main", "lexa_ws8_updated",
              "lexa_render_current_fix", "lexa_render_ts2339_fix",
              "lexa_workstream4_reviewed_patch", "lexa_workstreams_0_3_patch",
          }
          MAX_ENTRIES = 30000
          MAX_UNCOMPRESSED_BYTES = 500 * 1024 * 1024
          MAX_SINGLE_FILE_BYTES = 100 * 1024 * 1024
          MAX_COMPRESSION_RATIO = 250

          stage = Path(tempfile.mkdtemp(prefix="lexa-clean-import-"))
          try:
              with zipfile.ZipFile(archive) as source:
                  entries = source.infolist()
                  if not entries:
                      raise SystemExit("The uploaded ZIP is empty.")
                  if len(entries) > MAX_ENTRIES:
                      raise SystemExit(f"The ZIP contains too many entries ({len(entries)}).")
                  corrupt = source.testzip()
                  if corrupt is not None:
                      raise SystemExit(f"ZIP integrity check failed at {corrupt!r}.")

                  total_size = sum(item.file_size for item in entries if not item.is_dir())
                  if total_size > MAX_UNCOMPRESSED_BYTES:
                      raise SystemExit("The uncompressed ZIP exceeds the 500 MB safety limit.")

                  # Validate raw ZIP paths before choosing the application root.
                  raw_entries = []
                  seen_raw = {}
                  for item in entries:
                      raw = item.filename
                      if not raw or raw.startswith("/") or "\\" in raw or "\x00" in raw:
                          raise SystemExit(f"Unsafe ZIP path: {raw!r}")
                      clean = unicodedata.normalize("NFC", raw.rstrip("/"))
                      parts = clean.split("/")
                      if not clean or any(part in ("", ".", "..") for part in parts):
                          raise SystemExit(f"Unsafe ZIP path: {raw!r}")
                      if ":" in parts[0]:
                          raise SystemExit(f"Unsafe ZIP path: {raw!r}")
                      mode = item.external_attr >> 16
                      file_type = stat.S_IFMT(mode)
                      if stat.S_ISLNK(mode) or file_type not in (0, stat.S_IFREG, stat.S_IFDIR):
                          raise SystemExit(f"Symlinks and special files are not allowed: {raw!r}")
                      if not item.is_dir() and item.file_size > MAX_SINGLE_FILE_BYTES:
                          raise SystemExit(f"ZIP member is too large: {raw!r}")
                      if not item.is_dir() and item.file_size:
                          ratio = item.file_size / max(item.compress_size, 1)
                          if ratio > MAX_COMPRESSION_RATIO:
                              raise SystemExit(f"Suspicious compression ratio for {raw!r}.")
                      key = clean.casefold()
                      if key in seen_raw:
                          raise SystemExit(f"Duplicate or case-colliding ZIP path: {raw!r} and {seen_raw[key]!r}")
                      seen_raw[key] = raw
                      raw_entries.append((item, parts))

                  # Accept either the repository contents at ZIP root or one
                  # enclosing folder (for example LEXA_RELEASE/backend/...).
                  backend_prefixes = {
                      tuple(parts[:i])
                      for _, parts in raw_entries
                      for i in range(len(parts) - 1)
                      if parts[i:i + 2] == ["backend", "package.json"]
                  }
                  frontend_prefixes = {
                      tuple(parts[:i])
                      for _, parts in raw_entries
                      for i in range(len(parts) - 1)
                      if parts[i:i + 2] == ["lexa-frontend", "package.json"]
                  }
                  common_prefixes = backend_prefixes & frontend_prefixes
                  if len(common_prefixes) != 1:
                      raise SystemExit(
                          "Could not identify one unambiguous LEXA source root. The ZIP must contain "
                          "backend/package.json and lexa-frontend/package.json either directly at its "
                          "root or inside one enclosing folder."
                      )
                  prefix = next(iter(common_prefixes))
                  if len(prefix) > 1:
                      raise SystemExit("Only one enclosing folder is supported; nested repository wrappers are not allowed.")

                  files = set()
                  package_files = set()
                  lock_files = set()
                  root_items = set()
                  canonical_entries = []
                  skipped_metadata = 0
                  skipped_root_docs = []

                  for item, original_parts in raw_entries:
                      # Ignore common operating-system archive metadata.
                      if original_parts[0] == "__MACOSX" or original_parts[0].startswith("._"):
                          skipped_metadata += 1
                          continue
                      if prefix:
                          if tuple(original_parts[:len(prefix)]) != prefix:
                              raise SystemExit(f"Unexpected content outside the enclosing source folder: {item.filename!r}")
                          parts = original_parts[len(prefix):]
                      else:
                          parts = original_parts
                      if not parts:
                          continue
                      if any(part in FORBIDDEN_PARTS for part in parts):
                          raise SystemExit(f"Generated or unsafe path is not allowed: {item.filename!r}")
                      if any(part.lower() in LEGACY_COPY_NAMES for part in parts):
                          raise SystemExit(f"Nested or duplicate repository copy detected: {item.filename!r}")

                      clean = "/".join(parts)
                      if not item.is_dir() and len(parts) == 1:
                          root_name = parts[0]
                          if root_name.lower().endswith(".md") and root_name != "README.md":
                              skipped_root_docs.append(root_name)
                              continue
                          if root_name not in ALLOWED_ROOT_FILES:
                              raise SystemExit(f"Unexpected root-level file {root_name!r}. Put maintained documentation under docs/.")

                      root_items.add(parts[0])
                      if len(parts) > 1 and parts[0] not in ALLOWED_ROOT_DIRS:
                          raise SystemExit(f"Unexpected top-level directory {parts[0]!r}; expected the LEXA repository layout.")

                      filename = parts[-1]
                      if filename.lower().endswith((".zip", ".pyc")):
                          raise SystemExit(f"Nested archives and bytecode are not allowed: {item.filename!r}")
                      if filename.startswith(".env") and filename not in {".env.example", ".env.worker.example"}:
                          raise SystemExit(f"Potential secret environment file found: {item.filename!r}")

                      if not item.is_dir():
                          files.add(clean)
                          if filename == "package.json":
                              package_files.add(clean)
                          if filename == "package-lock.json":
                              lock_files.add(clean)
                      canonical_entries.append((item, clean, item.is_dir()))

                  required_dirs = {"backend", "lexa-frontend", "docs", "scripts"}
                  if not required_dirs.issubset(root_items):
                      raise SystemExit(f"Missing canonical application directories: {sorted(required_dirs - root_items)}")
                  unexpected_roots = root_items - ALLOWED_ROOT_DIRS - ALLOWED_ROOT_FILES
                  if unexpected_roots:
                      raise SystemExit(f"Unexpected or nested top-level directories: {sorted(unexpected_roots)}")

                  missing = sorted(REQUIRED_FILES - files)
                  if missing:
                      raise SystemExit("Required source files are missing: " + ", ".join(missing))
                  if package_files != EXPECTED_PACKAGE_FILES:
                      raise SystemExit("The ZIP must contain exactly one backend and one frontend package.json; found: " + repr(sorted(package_files)))
                  if not lock_files.issubset(EXPECTED_LOCK_FILES):
                      raise SystemExit("Unexpected package lockfiles found: " + repr(sorted(lock_files)))

                  # Check package metadata and any lockfiles supplied by the ZIP.
                  package_data_by_path = {}
                  entry_by_name = {name: item for item, name, is_dir in canonical_entries if not is_dir}
                  for package_path in sorted(EXPECTED_PACKAGE_FILES):
                      try:
                          package_data = json.loads(source.read(entry_by_name[package_path]))
                      except (KeyError, json.JSONDecodeError) as exc:
                          raise SystemExit(f"Invalid or missing package manifest: {package_path}: {exc}")
                      if not isinstance(package_data, dict) or not package_data.get("name"):
                          raise SystemExit(f"Package manifest must contain a package name: {package_path}")
                      package_data_by_path[package_path] = package_data

                  for lock_path in sorted(lock_files):
                      try:
                          lock_data = json.loads(source.read(entry_by_name[lock_path]))
                      except (KeyError, json.JSONDecodeError) as exc:
                          raise SystemExit(f"Invalid package lockfile: {lock_path}: {exc}")
                      app_path = lock_path.removesuffix("package-lock.json") + "package.json"
                      lock_name = lock_data.get("name") or lock_data.get("packages", {}).get("", {}).get("name")
                      expected_name = package_data_by_path[app_path].get("name")
                      if lock_name and lock_name != expected_name:
                          raise SystemExit(f"Package and lockfile names do not match for {lock_path}.")

                  # Extract into a new staging tree only after validation.
                  # The live .github directory is preserved, not replaced.
                  for item, clean, is_dir in canonical_entries:
                      parts = clean.split("/")
                      if parts[0] == ".github":
                          continue
                      if len(parts) == 1 and parts[0].lower().endswith(".md") and parts[0] != "README.md":
                          continue
                      destination = stage.joinpath(*parts)
                      if is_dir:
                          destination.mkdir(parents=True, exist_ok=True)
                          continue
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      if not destination.resolve().is_relative_to(stage.resolve()):
                          raise SystemExit(f"ZIP path escaped the staging directory: {item.filename!r}")
                      with source.open(item) as source_file, destination.open("xb") as target_file:
                          shutil.copyfileobj(source_file, target_file)

              for required in REQUIRED_FILES:
                  if not stage.joinpath(*required.split("/")).is_file():
                      raise SystemExit(f"Staged source is incomplete: {required}")
              staged_packages = {
                  path.relative_to(stage).as_posix()
                  for path in stage.rglob("package.json")
              }
              if staged_packages != EXPECTED_PACKAGE_FILES:
                  raise SystemExit(f"Staged source contains duplicate application manifests: {sorted(staged_packages)}")

              print(f"Validated {archive.name}; {len(files)} source files; {total_size:,} uncompressed bytes.")
              if prefix:
                  print(f"Removed one enclosing ZIP folder: {'/'.join(prefix)}")
              if skipped_root_docs:
                  print("Removed obsolete root-level Markdown notes; maintained documentation remains under docs/.")
              if skipped_metadata:
                  print(f"Ignored {skipped_metadata} macOS archive metadata entries.")

              # Replace old project files while retaining Git metadata and
              # existing workflows. This change is committed only after tests pass.
              for child in ROOT.iterdir():
                  if child.name in {".git", ".github"}:
                      continue
                  if child.is_dir() and not child.is_symlink():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
              for child in stage.iterdir():
                  destination = ROOT / child.name
                  if child.is_dir():
                      shutil.copytree(child, destination)
                  else:
                      shutil.copy2(child, destination)
              print("Source staged in the checkout. Existing GitHub workflows were preserved.")
          finally:
              shutil.rmtree(stage, ignore_errors=True)
          PY

      - name: Generate any missing npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for app in backend lexa-frontend; do
            if [ ! -f "$app/package-lock.json" ]; then
              echo "No $app/package-lock.json was included; generating it from $app/package.json."
              (
                cd "$app"
                npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              )
            fi
            test -s "$app/package-lock.json"
          done

      - name: Remove generated leftovers and validate repository layout
        run: |
          python3 scripts/clean_repository.py
          python3 scripts/validate_repository.py

      - name: Install and validate backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/lexa?schema=public
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npm test
          npm run contract:check
          npm run build

      - name: Install, test and build frontend
        working-directory: lexa-frontend
        run: |
          npm ci --no-audit 
