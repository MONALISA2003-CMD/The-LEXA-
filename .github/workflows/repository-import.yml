name: Refresh LEXA from a clean repository ZIP

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
  workflow_dispatch:
    inputs:
      archive_name:
        description: "Root-level ZIP filename to import"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lexa-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Validate, replace and verify the source tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering ZIP commit
        uses: actions/checkout@v5
        with:
          # A queued push must read the exact commit that contains its ZIP.
          # Checking out a moving 'main' can lose the uploaded archive.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Skip superseded ZIP uploads safely
        id: upload_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          # A ZIP upload may have been replaced by a later upload while queued.
          # Never replace newer source with a superseded archive.
          git fetch --no-tags origin main --quiet
          if [ "$EVENT_NAME" = push ] && [ "$(git rev-parse refs/remotes/origin/main)" != "$EVENT_SHA" ]; then
            echo 'Import skipped: a newer commit is already on main.'
            echo 'should_import=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_import=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Import one clean root-level ZIP
        if: steps.upload_check.outputs.should_import == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_ARCHIVE: ${{ inputs.archive_name || '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, shutil, stat, subprocess, tempfile, zipfile

          root = Path.cwd()
          requested = os.environ.get("REQUESTED_ARCHIVE", "").strip()
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              if not requested or PurePosixPath(requested).name != requested or not requested.lower().endswith(".zip"):
                  raise SystemExit("Provide one root-level ZIP filename ending in .zip.")
              archives = [requested]
          else:
              before, head = os.environ.get("EVENT_BEFORE", ""), os.environ["EVENT_SHA"]
              if not before or set(before) == {"0"}:
                  changed = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", head], text=True).splitlines()
              else:
                  changed = subprocess.check_output(["git", "diff", "--name-only", before, head], text=True).splitlines()
              archives = [p for p in changed if PurePosixPath(p).parent == PurePosixPath(".") and p.lower().endswith(".zip")]
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one changed root-level ZIP; found {archives!r}.")
          archive = root / archives[0]
          if not archive.is_file() or archive.is_symlink():
              raise SystemExit("The selected archive is not a regular file.")

          allowed_dirs = {"backend", "lexa-frontend", "docs", "scripts"}
          allowed_files = {".dockerignore", ".gitignore", ".nvmrc", "README.md", "REPOSITORY_LAYOUT_MANIFEST.json", "render.yaml", "LICENSE", "LICENSE.md", "NOTICE", "SECURITY.md", "CODEOWNERS", ".gitattributes", ".editorconfig", ".prettierrc", ".prettierignore"}
          required = {
              "README.md", "render.yaml", "REPOSITORY_LAYOUT_MANIFEST.json",
              "backend/package.json", "backend/Dockerfile", "backend/prisma/schema.prisma",
              "lexa-frontend/package.json", "lexa-frontend/vercel.json",
              "scripts/clean_repository.py", "scripts/validate_repository.py",
              "docs/architecture/backend-architecture.md", "docs/deployment/deployment-guide.md",
              "docs/operations/runbooks/README.md",
          }
          forbidden_parts = {".git", "node_modules", "dist", "coverage", ".vercel", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", ".turbo"}
          stage = Path(tempfile.mkdtemp(prefix="lexa-import-"))
          try:
              with zipfile.ZipFile(archive) as z:
                  members = z.infolist()
                  if not members or len(members) > 30000 or z.testzip() is not None:
                      raise SystemExit("ZIP is empty, too large, or corrupt.")
                  seen, files, roots = set(), set(), set()
                  for item in members:
                      name = item.filename
                      if not name or name.startswith("/") or "\\" in name or "\x00" in name:
                          raise SystemExit(f"Unsafe ZIP path: {name!r}")
                      clean = name.rstrip("/")
                      parts = clean.split("/")
                      if not clean or any(p in ("", ".", "..") for p in parts) or ":" in parts[0]:
                          raise SystemExit(f"Unsafe ZIP path: {name!r}")
                      mode = item.external_attr >> 16
                      kind = stat.S_IFMT(mode)
                      if stat.S_ISLNK(mode) or kind not in (0, stat.S_IFREG, stat.S_IFDIR):
                          raise SystemExit(f"Links and special files are not allowed: {name!r}")
                      key = clean.casefold()
                      if key in seen:
                          raise SystemExit(f"Duplicate/case-colliding path: {name!r}")
                      seen.add(key)
                      if any(p in forbidden_parts for p in parts):
                          raise SystemExit(f"Generated/dependency content is not allowed: {name!r}")
                      if any(p.lower() in {"the-lexa", "the-lexa--main", "lexa_ws7_updated", "lexa_ws8_updated", "lexa_render_current_fix", "lexa_render_ts2339_fix", "increment-5"} for p in parts):
                          raise SystemExit(f"Nested/duplicate repository copy detected: {name!r}")
                      if parts[0] == ".github":
                          raise SystemExit("Do not include .github in the source ZIP; workflows are preserved from the repository.")
                      if len(parts) == 1 and not item.is_dir() and parts[0] not in allowed_files:
                          raise SystemExit(f"Unexpected root-level file: {name!r}")
                      if len(parts) > 1 and parts[0] not in allowed_dirs:
                          raise SystemExit(f"Unexpected top-level directory or wrapper folder: {parts[0]!r}")
                      if parts[-1].lower().endswith((".zip", ".pyc")):
                          raise SystemExit(f"Nested archives/bytecode are not allowed: {name!r}")
                      if parts[-1].startswith(".env") and parts[-1] not in {".env.example", ".env.worker.example"}:
                          raise SystemExit(f"Potential live secret file: {name!r}")
                      if not item.is_dir():
                          if item.file_size > 100 * 1024 * 1024:
                              raise SystemExit(f"File is too large: {name!r}")
                          files.add(clean)
                          if parts[-1] == "package.json" and parts[0] not in {"backend", "lexa-frontend"}:
                              raise SystemExit(f"Unexpected package manifest: {name!r}")
                      roots.add(parts[0])
                  if not allowed_dirs.issubset(roots):
                      raise SystemExit(f"Missing canonical source directories: {sorted(allowed_dirs - roots)}")
                  if files & {"backend/package.json", "lexa-frontend/package.json"} != {"backend/package.json", "lexa-frontend/package.json"}:
                      raise SystemExit("The archive must contain exactly the backend and frontend package manifests.")
                  package_manifests = [p for p in files if p.endswith("/package.json")]
                  if sorted(package_manifests) != ["backend/package.json", "lexa-frontend/package.json"]:
                      raise SystemExit(f"Expected exactly two package manifests; found {sorted(package_manifests)}")
                  missing = sorted(required - files)
                  if missing:
                      raise SystemExit("Required files are missing: " + ", ".join(missing))

                  # Extract only after every member passes validation. .github stays untouched.
                  for item in members:
                      if item.is_dir():
                          continue
                      target = stage.joinpath(*item.filename.rstrip("/").split("/"))
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, target.open("xb") as dst:
                          shutil.copyfileobj(src, dst)

              # Replace all source/config/docs files, keeping Git metadata and workflows.
              for child in root.iterdir():
                  if child.name in {".git", ".github"}:
                      continue
                  if child.is_dir() and not child.is_symlink(): shutil.rmtree(child)
                  else: child.unlink()
              for child in stage.iterdir():
                  dest = root / child.name
                  if child.is_dir(): shutil.copytree(child, dest)
                  else: shutil.copy2(child, dest)
              print(f"Imported {len(files)} files from {archive.name}; workflows and Git metadata were preserved.")
          finally:
              shutil.rmtree(stage, ignore_errors=True)
          PY

      - name: Validate canonical repository layout
        if: steps.upload_check.outputs.should_import == 'true'
        run: |
          python3 scripts/clean_repository.py
          python3 scripts/validate_repository.py

      - name: Test and build backend
        if: steps.upload_check.outputs.should_import == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/lexa?schema=public
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npx prisma validate
          npm test
          npm run contract:check
          npm run build

      - name: Test and build frontend
        if: steps.upload_check.outputs.should_import == 'true'
        working-directory: lexa-frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit one clean source update
        if: steps.upload_check.outputs.should_import == 'true'
        run: |
          # A second check prevents publishing over an intervening main push.
          git fetch --no-tags origin main --quiet
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo 'Main changed while this import was being tested. No changes published.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Refresh LEXA source from validated archive"
          git push origin HEAD:main
