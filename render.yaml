# Render Blueprint for the existing LEXA production API service.
# This is the live 1 vCPU / 2 GB compute plan, not the legacy buildPlan field.
services:
  - type: web
    name: lexa-backend-api-live
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    branch: main
    # A root ZIP upload is not validated application source. Wait for GitHub CI
    # on the imported source commit before deploying the production backend.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - render.yaml
        - .dockerignore
      ignoredPaths:
        - "*.zip"
    # HTTP readiness probes fail new deploys before they receive production traffic.
    # HealthController.ready verifies the database, not merely an open TCP port.
    healthCheckPath: /health/ready
    numInstances: 1
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      # The existing DATABASE_URL secret is intentionally not declared or replaced here.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DATABASE_RUNTIME_ROLE
        value: lexa_app_runtime
      - key: FRONTEND_PUBLIC_URL
        value: https://lexaaamaal.com
      # Set these two secrets in Render dashboard after verifying the sender in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: LEXA_AI_ENABLED
        value: "true"
      - key: LEXA_AI_PAID_TIER_ENABLED
        value: "false"
      - key: LEXA_AI_PUBLIC_HELP_CONFIGURED
        value: "true"
      - key: LEXA_AI_BUSINESS_CONFIGURED
        value: "true"
      - key: GEMINI_FREE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: "nvidia/nemotron-3.5-lightning-30b-a3b"
