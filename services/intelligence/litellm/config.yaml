# LEXA Intelligence provider policy.
# The public pool is used ONLY for generic LEXA product guidance.
# The paid pool is the ONLY route allowed for confidential business aggregates.
# Duplicate model_name entries are intentional LiteLLM Router deployments; failures
# and provider rate limits are retried within the same pool, never across pools.
model_list:
  # Paid business pool: Gemini API (paid project) and OpenAI.
  - model_name: lexa-business-paid
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 30
  - model_name: lexa-business-paid
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      rpm: 30

  # Public product-help pool only. Never route tenant-specific financial, HR,
  # customer or operational aggregates through these deployments.
  - model_name: lexa-public-help
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_FREE_API_KEY
      rpm: 10
  - model_name: lexa-public-help
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 20
  - model_name: lexa-public-help
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 10
  - model_name: lexa-public-help
    litellm_params:
      model: cerebras/qwen-3.8-27b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 10
  - model_name: lexa-public-help
    litellm_params:
      model: cerebras/openai-gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 5
  - model_name: lexa-public-help
    litellm_params:
      model: openrouter/openai/gpt-oss-20b:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 5
  # Hugging Face is not a free-tier promise. It is opt-in and may consume
  # paid HF/provider credits, so keep it disabled until billing and caps exist.
  - model_name: lexa-public-help
    litellm_params:
      model: huggingface/Qwen/Qwen3-8B
      api_key: os.environ/HF_TOKEN
      rpm: 2

litellm_settings:
  set_verbose: false
  turn_off_message_logging: true
  drop_params: true
  request_timeout: 35
  num_retries: 1
  json_logs: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 60
  retry_after: 1
  enable_pre_call_checks: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  store_prompts_in_spend_logs: false
